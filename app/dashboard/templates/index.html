<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Egyxos Assessment Console</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <main class="mx-auto max-w-7xl p-6">
    <header class="flex flex-wrap items-center justify-between gap-4 border-b border-slate-800 pb-6">
      <div class="flex items-center gap-4"><img src="/assets/logo.svg" class="h-12 w-12 rounded-xl bg-blue-500 p-2" alt="Egyxos logo"><div><p class="text-xs uppercase tracking-[.25em] text-blue-300">Egyxos</p><h1 class="text-2xl font-bold">Assessment Console</h1></div></div>
      <span class="rounded-full border border-emerald-700 bg-emerald-950 px-3 py-1 text-xs text-emerald-300">Lab mode · explicit approval required</span>
    </header>
    <section class="mt-8 grid gap-5 lg:grid-cols-[380px_1fr]">
      <aside class="space-y-5">
        <div class="rounded-2xl border border-slate-800 bg-slate-900 p-5"><h2 class="font-semibold">Authorized scope</h2><p class="mt-1 text-sm text-slate-400">Only targets matching this allowlist can be assessed.</p><form id="scope-form" class="mt-4 space-y-3"><input id="scope-name" class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2" placeholder="Scope name" value="Local evaluation lab"><input id="scope-targets" class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2" value="localhost,127.0.0.1,juice-shop,dvwa"><button class="w-full rounded-lg bg-blue-600 px-3 py-2 font-semibold hover:bg-blue-500">Save scope</button></form></div>
        <div class="rounded-2xl border border-slate-800 bg-slate-900 p-5"><h2 class="font-semibold">Start assessment</h2><form id="scan-form" class="mt-4 space-y-3"><select id="scan-scope" class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2"></select><input id="scan-target" class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2" value="localhost"><select id="scan-mode" class="w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2"><option value="passive_recon">Passive Recon</option><option value="full_reconnaissance">Full Reconnaissance</option><option value="active_vuln">Active Vulnerability Scan</option></select><label class="flex gap-2 text-sm"><input type="checkbox" name="tool" value="subfinder" checked> subfinder</label><label class="flex gap-2 text-sm"><input type="checkbox" name="tool" value="httpx" checked> httpx</label><label class="flex gap-2 text-sm"><input type="checkbox" name="tool" value="nuclei"> nuclei</label><button class="w-full rounded-lg bg-amber-500 px-3 py-2 font-semibold text-slate-950 hover:bg-amber-400">Plan assessment</button></form></div>
      </aside>
      <section class="space-y-5"><div id="message" class="hidden rounded-xl border border-slate-700 bg-slate-900 p-4 text-sm"></div><div class="grid gap-4 sm:grid-cols-3"><div class="rounded-2xl border border-slate-800 bg-slate-900 p-5"><p class="text-sm text-slate-400">Scopes</p><strong id="scope-count" class="mt-2 block text-3xl">0</strong></div><div class="rounded-2xl border border-slate-800 bg-slate-900 p-5"><p class="text-sm text-slate-400">Assessments</p><strong id="scan-count" class="mt-2 block text-3xl">0</strong></div><div class="rounded-2xl border border-slate-800 bg-slate-900 p-5"><p class="text-sm text-slate-400">Findings</p><strong id="finding-count" class="mt-2 block text-3xl">0</strong></div></div><div class="rounded-2xl border border-slate-800 bg-slate-900 p-5"><div class="flex items-center justify-between"><h2 class="font-semibold">Assessments &amp; approval gates</h2><button id="refresh" class="text-sm text-blue-300">Refresh</button></div><div id="scans" class="mt-4 space-y-3"></div></div><div class="rounded-2xl border border-slate-800 bg-slate-900 p-5"><h2 class="font-semibold">AI-triaged findings</h2><div id="findings" class="mt-4 space-y-3"></div></div><div class="rounded-2xl border border-slate-800 bg-slate-900 p-5"><h2 class="font-semibold">Audit log</h2><div id="audit" class="mt-4 space-y-2 text-sm text-slate-400"></div></div></section>
    </section>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    const show = (text, error = false) => { $("message").textContent = text; $("message").className = `rounded-xl border p-4 text-sm ${error ? "border-red-800 bg-red-950 text-red-200" : "border-slate-700 bg-slate-900 text-slate-300"}`; };
    const api = async (path, options) => { const response = await fetch(path, { headers: {"Content-Type":"application/json"}, ...options }); const body = await response.json(); if (!response.ok) throw new Error(body.detail || body.error || "Request failed"); return body; };
    async function refresh() { const [scopes, scans, findings, audit] = await Promise.all([api("/api/v1/scopes"), api("/api/v1/scans"), api("/api/v1/findings"), api("/api/v1/audit")]); $("scope-count").textContent = scopes.length; $("scan-count").textContent = scans.length; $("finding-count").textContent = findings.length; $("scan-scope").innerHTML = scopes.map(s => `<option value="${s.id}">${s.name}</option>`).join("") || "<option value=''>Create a scope first</option>"; $("scans").innerHTML = scans.map(s => `<article class="rounded-xl border border-slate-800 bg-slate-950 p-4"><div class="flex flex-wrap justify-between gap-2"><strong>#${s.id} · ${s.target}</strong><span class="text-xs text-amber-300">${s.status}</span></div><p class="mt-1 text-xs text-slate-500">${s.scan_mode} · ${s.selected_tools.join(", ")}</p>${s.approval_status === "PENDING_APPROVAL" ? `<div class="mt-3 flex gap-2"><button onclick="decide(${s.id},true)" class="rounded bg-emerald-600 px-3 py-1 text-xs">Approve Active Scan</button><button onclick="decide(${s.id},false)" class="rounded bg-red-800 px-3 py-1 text-xs">Reject</button></div>` : ""}<div class="mt-3 flex gap-2 text-xs"><a class="text-blue-300" href="/api/v1/reports/${s.id}?format=markdown">Markdown</a><a class="text-blue-300" href="/api/v1/reports/${s.id}?format=html">HTML</a><a class="text-blue-300" href="/api/v1/reports/${s.id}?format=json">JSON</a></div></article>`).join("") || "<p class='text-sm text-slate-500'>No assessments yet.</p>"; $("findings").innerHTML = findings.map(f => `<article class="rounded-xl border border-slate-800 bg-slate-950 p-4"><div class="flex flex-wrap justify-between gap-2"><strong>${f.title}</strong><span class="text-xs text-blue-300">${f.ai_severity} · ${f.ai_classification}</span></div><p class="mt-1 text-xs text-slate-400">${f.asset} · ${f.source_tool}</p><p class="mt-2 text-xs text-slate-500">${f.is_likely_false_positive ? "Likely false positive: " : ""}${f.ai_remediation}</p></article>`).join("") || "<p class='text-sm text-slate-500'>No normalized findings yet.</p>"; $("audit").innerHTML = audit.slice(0,12).map(e => `<div><span class="text-slate-200">${e.action}</span> · ${e.target || "system"} <span class="text-xs">${new Date(e.timestamp).toLocaleString()}</span></div>`).join("") || "No audit activity yet."; }
    async function decide(id, approved) { try { await api(`/api/v1/scans/${id}/approval`, {method:"POST", body:JSON.stringify({approved})}); show(approved ? "Scan approved and pipeline executed." : "Scan rejected and blocked."); await refresh(); } catch (e) { show(e.message, true); } }
    $("scope-form").addEventListener("submit", async (e) => { e.preventDefault(); try { await api("/api/v1/scopes", {method:"POST", body:JSON.stringify({name:$("scope-name").value, allowed_targets:$("scope-targets").value.split(",").map(v=>v.trim()).filter(Boolean)})}); show("Authorized scope saved."); await refresh(); } catch (e) { show(e.message, true); } });
    $("scan-form").addEventListener("submit", async (e) => { e.preventDefault(); try { await api("/api/v1/scans", {method:"POST", body:JSON.stringify({scope_id:Number($("scan-scope").value), target:$("scan-target").value, scan_mode:$("scan-mode").value, selected_tools:[...document.querySelectorAll("input[name=tool]:checked")].map(i=>i.value)})}); show("Assessment planned. Active tools will pause at the approval gate."); await refresh(); } catch (e) { show(e.message, true); } });
    $("refresh").addEventListener("click", refresh); refresh().catch(e => show(e.message, true));
  </script>
</body>
</html>

services:
  egyxos-platform:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: sqlite:///./egyxos.db
      LAB_MODE: "true"
      DEMO_MODE: "true"
    volumes:
      - ./reports:/app/reports
      - egyxos-data:/app/data
    depends_on:
      - juice-shop
      - dvwa
  juice-shop:
    image: bkimminich/juice-shop:latest
    ports:
      - "127.0.0.1:3000:3000"
  dvwa:
    image: vulnerables/web-dvwa:latest
    ports:
      - "127.0.0.1:8080:80"

volumes:
  egyxos-data:
